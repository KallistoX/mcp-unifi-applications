[project]
name = "mcp-unifi-applications"
version = "0.1.0"
description = "MCP server exposing UniFi application API documentation (Network, Protect, Site Manager) as queryable tools"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Dominic Bussemas" },
]
keywords = ["mcp", "unifi", "ubiquiti", "api", "documentation", "claude", "protect", "site-manager"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "fastmcp>=3.4",
    "rapidfuzz>=3.14.5",
]

[project.urls]
Repository = "https://github.com/KallistoX/mcp-unifi-applications"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.14"]

[project.scripts]
mcp-unifi-applications = "mcp_server:mcp.run"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set explicitly so a ruff default-rule expansion (as in 0.16,
# which newly enabled I/PERF) can't fail CI out of the blue. This is ruff's
# classic stable default (E4/E7/E9, F) plus isort import sorting (I).
select = ["E4", "E7", "E9", "F", "I"]
