name: Update docs

on:
  schedule:
    - cron: "17 5 * * 1"  # Mondays 05:17 UTC
  workflow_dispatch:
    inputs:
      force_apps:
        description: >-
          Re-scrape these apps even when the version is unchanged: "all", or a
          comma-separated list. Needed after a scraper fix, where the upstream
          version is identical but the output is not.
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-docs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.compare.outputs.apps }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Gate BEFORE the expensive scrape: ruff lints source (scrape-independent)
      # and pytest runs against the committed docs. If this fails, `scrape`
      # (needs: check) never runs, so a lint/test error can't waste an 82-page
      # scrape. The post-scrape pytest still re-validates the fresh output.
      - name: Lint and test (gate before scraping)
        run: |
          pip install .[dev]
          ruff check .
          pytest tests/ -v

      - name: Compare upstream vs scraped versions
        id: compare
        run: |
          set -euo pipefail
          ALL_APPS="network protect site-manager innerspace mobility carrier-fabric"
          FORCE="${{ github.event.inputs.force_apps }}"
          if [ "$FORCE" = "all" ]; then
            printf 'apps=%s\n' "$(printf '%s\n' $ALL_APPS | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
            echo "Forced re-scrape of every app."
            exit 0
          fi
          if [ -n "$FORCE" ]; then
            forced=$(echo "$FORCE" | tr ',' '\n' | sed 's/[[:space:]]//g' | grep -v '^$' || true)
            for app in $forced; do
              case " $ALL_APPS " in
                *" $app "*) ;;
                *) echo "::error::Unknown app '$app' in force_apps. Known: $ALL_APPS"; exit 1 ;;
              esac
            done
            printf 'apps=%s\n' "$(printf '%s\n' $forced | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
            echo "Forced re-scrape of: $forced"
            exit 0
          fi
          outdated=()
          for app in $ALL_APPS; do
            html=$(curl -fsSL --max-time 30 "https://developer.ui.com/${app}")
            latest=$(echo "$html" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -uV | tail -1 || true)
            if [ -z "$latest" ]; then
              echo "::error::No version strings found in https://developer.ui.com/${app} - site layout may have changed"
              exit 1
            fi
            current="v$(python3 -c "import json; print(json.load(open('src/mcp_unifi_applications/docs/${app}/_meta.json'))['version'])" 2>/dev/null || echo 0.0.0)"
            echo "${app}: scraped=${current} upstream=${latest}"
            if [ "$latest" != "$current" ]; then
              outdated+=("$app")
            fi
          done
          if [ "${#outdated[@]}" -eq 0 ]; then
            apps="[]"
          else
            apps=$(printf '%s\n' "${outdated[@]}" | jq -R . | jq -cs .)
          fi
          echo "apps=${apps}" >> "$GITHUB_OUTPUT"

  scrape:
    needs: check
    if: needs.check.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.check.outputs.apps) }}
    steps:
      - uses: actions/checkout@v5

      - name: Build scraper image
        run: docker build -t unifi-scraper .

      - name: Scrape ${{ matrix.app }}
        run: |
          rm -f "src/mcp_unifi_applications/docs/${{ matrix.app }}"/*.json "src/mcp_unifi_applications/docs/${{ matrix.app }}/_failed.txt"
          docker run --rm -v "${{ github.workspace }}/src/mcp_unifi_applications/docs:/output" unifi-scraper \
            node scrape.mjs --app "${{ matrix.app }}" --force
          # The container writes as root. For an app that already exists the files
          # keep the runner's ownership on overwrite, but a new app's files land
          # root-owned, and git then cannot remove them - which aborts the branch
          # checkout in create-pull-request with "untracked files would be
          # overwritten" after 14 "Permission denied" unlink warnings.
          sudo chown -R "$(id -u):$(id -g)" "src/mcp_unifi_applications/docs/${{ matrix.app }}"

      - name: Fail if pages failed to scrape
        run: |
          if [ -f "src/mcp_unifi_applications/docs/${{ matrix.app }}/_failed.txt" ]; then
            echo "::error::Scrape had failures - not opening a PR"
            cat "src/mcp_unifi_applications/docs/${{ matrix.app }}/_failed.txt"
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test against fresh docs
        run: |
          pip install .[dev]
          pytest tests/ -v

      - name: Read scraped version and diff stats
        id: stats
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('src/mcp_unifi_applications/docs/${{ matrix.app }}/_meta.json'))['version'])")
          git add -A "src/mcp_unifi_applications/docs/${{ matrix.app }}"
          added=$(git diff --cached --no-renames --name-status -- "src/mcp_unifi_applications/docs/${{ matrix.app }}" | grep -c '^A' || true)
          modified=$(git diff --cached --no-renames --name-status -- "src/mcp_unifi_applications/docs/${{ matrix.app }}" | grep -c '^M' || true)
          deleted=$(git diff --cached --no-renames --name-status -- "src/mcp_unifi_applications/docs/${{ matrix.app }}" | grep -c '^D' || true)
          {
            echo "version=${version}"
            echo "added=${added}"
            echo "modified=${modified}"
            echo "deleted=${deleted}"
          } >> "$GITHUB_OUTPUT"

      # NOTE: PRs created with GITHUB_TOKEN do not trigger ci.yml (GitHub suppresses
      # workflow events for Actions-created PRs). The merge gate for these PRs is the
      # check job's ruff+pytest gate plus the pytest step above, which re-validates
      # against the fresh docs before the PR opens.
      - name: Open PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update-docs/${{ matrix.app }}-v${{ steps.stats.outputs.version }}
          title: "docs(${{ matrix.app }}): update scraped docs to v${{ steps.stats.outputs.version }}"
          commit-message: "docs(${{ matrix.app }}): update scraped docs to v${{ steps.stats.outputs.version }}"
          # Deliberately does NOT include README.md. Every app's job would
          # regenerate the same version-table block from its own branch, so a
          # week with two updates produced PRs that conflicted on exactly those
          # lines. sync-readme-table.yml regenerates it on main after the merge.
          add-paths: src/mcp_unifi_applications/docs/${{ matrix.app }}/**
          body: |
            Automated docs refresh: upstream published **v${{ steps.stats.outputs.version }}** for `${{ matrix.app }}`.

            - Pages: ${{ steps.stats.outputs.added }} added, ${{ steps.stats.outputs.modified }} modified, ${{ steps.stats.outputs.deleted }} removed
            - Scrape had no failed pages; pytest passed against the fresh docs (ruff + pytest also gated pre-scrape).

            Weekly `update-docs` workflow.
