name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version the classifiers in pyproject.toml claim. Claiming one
        # that is not exercised here is an assertion, not a fact.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install .[dev]

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Shell-expanded so node receives file paths: `node --test tests/` needs
      # directory discovery, which Node 22 (the runner default) does not do for
      # positional arguments - it tries to load the directory as a module.
      - name: Run scraper parser tests
        run: node --test tests/*.test.mjs

      # A wheel that ships no module or no docs installs cleanly and then fails
      # at runtime, which pytest above would not catch — it imports from src/.
      - name: Build wheel and verify its contents
        run: |
          pip install build
          python -m build --wheel
          python scripts/check_wheel.py
