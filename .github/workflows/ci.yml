name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install .[dev]

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v

      # A wheel that ships no module or no docs installs cleanly and then fails
      # at runtime, which pytest above would not catch — it imports from src/.
      - name: Build wheel and verify its contents
        run: |
          pip install build
          python -m build --wheel
          python scripts/check_wheel.py
