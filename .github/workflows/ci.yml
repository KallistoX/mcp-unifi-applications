name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # update-docs.yml opens its PRs with add-paths limited to the scraped docs,
    # gates them with ruff + pytest itself and merges within seconds. A CI run
    # on such a PR never ran a job: it waited for approval as a bot run, and
    # since the auto-merge it fails with zero jobs on the already-merged PR.
    # A PR that touches only scraped docs therefore starts no run here.
    paths-ignore:
      - "src/mcp_unifi_applications/docs/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version the classifiers in pyproject.toml claim. Claiming one
        # that is not exercised here is an assertion, not a fact.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install .[dev]

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Shell-expanded so node receives file paths: `node --test tests/` needs
      # directory discovery, which Node 22 (the runner default) does not do for
      # positional arguments - it tries to load the directory as a module.
      - name: Run scraper parser tests
        run: node --test tests/*.test.mjs

      # A wheel that ships no module or no docs installs cleanly and then fails
      # at runtime, which pytest above would not catch — it imports from src/.
      - name: Build wheel and verify its contents
        run: |
          pip install build
          python -m build --wheel
          python scripts/check_wheel.py
